name: zAppleDocSync
options:
  bundleIdPrefix: com.zapple
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  zAppleDocSync:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zapple.docsync
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The part of the Google OAuth iOS client ID before ".apps.googleusercontent.com".
        # Passed in by CI from the GOOGLE_CLIENT_ID_PREFIX repository variable.
        GOOGLE_CLIENT_ID_PREFIX: ""
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: DocSync
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        GIDClientID: $(GOOGLE_CLIENT_ID_PREFIX).apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - com.googleusercontent.apps.$(GOOGLE_CLIENT_ID_PREFIX)
  zAppleDocSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: zAppleDocSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zapple.docsync.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  zAppleDocSync:
    build:
      targets:
        zAppleDocSync: all
        zAppleDocSyncTests: [test]
    test:
      targets:
        - zAppleDocSyncTests
