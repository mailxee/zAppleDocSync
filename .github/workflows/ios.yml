name: iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GOOGLE_CLIENT_ID_PREFIX: ${{ vars.GOOGLE_CLIENT_ID_PREFIX }}
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project zAppleDocSync.xcodeproj \
            -scheme zAppleDocSync \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/test \
            GOOGLE_CLIENT_ID_PREFIX="$GOOGLE_CLIENT_ID_PREFIX" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build \
            -project zAppleDocSync.xcodeproj \
            -scheme zAppleDocSync \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            GOOGLE_CLIENT_ID_PREFIX="$GOOGLE_CLIENT_ID_PREFIX" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/device/Build/Products/Release-iphoneos/zAppleDocSync.app Payload/
          zip -qry zAppleDocSync-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: zAppleDocSync-unsigned-ipa
          path: zAppleDocSync-unsigned.ipa
          if-no-files-found: error
